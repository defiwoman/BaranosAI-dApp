<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>Form declaration</title>
  </head>
  <body>
    <!--
      Static declarations for Netlify Forms. Netlify registers these forms at deploy time; the app
      posts to this file with the same field names (see src/adapters/submission.ts, where a test
      keeps both lists identical). After storing a submission Netlify serves the form's action
      page, whose marker the app checks for, and sends the notifications configured under
      Forms → Form notifications. Submissions are private to the site owner.
      `subject` sets the notification email's subject line.
    -->
    <form name="registration" method="POST" action="/registration-received.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="registration" />
      <input name="bot-field" />
      <input type="hidden" name="subject" value="[BaranosAI Quest] Registration" />
      <input name="formType" />
      <input name="submissionId" />
      <input name="participantId" />
      <input name="displayName" />
      <input name="xHandle" />
      <input name="registrationType" />
      <input name="submittedAt" />
      <input name="environment" />
      <input name="siteHost" />
      <textarea name="readableSubmission"></textarea>
    </form>
    <form name="use-case" method="POST" action="/use-case-received.html" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="use-case" />
      <input name="bot-field" />
      <input type="hidden" name="subject" value="[BaranosAI Quest] Case study" />
      <input name="formType" />
      <input name="submissionId" />
      <input name="participantId" />
      <input name="displayName" />
      <input name="xHandle" />
      <input name="title" />
      <textarea name="whoAndWhat"></textarea>
      <textarea name="whyVerify"></textarea>
      <input name="curriculumVersion" />
      <input name="submittedAt" />
      <input name="environment" />
      <input name="siteHost" />
      <textarea name="readableSubmission"></textarea>
    </form>
  </body>
</html>
