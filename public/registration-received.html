<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Registration received · BaranosAI Educational Quest</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #060c2c; color: #e2ebfc; font-family: system-ui, sans-serif; }
      main { max-width: 32em; padding: 24px; text-align: center; }
      a { color: #bfd3f6; }
    </style>
  </head>
  <body>
    <!-- Netlify Forms shows this page after it stores a registration (the form's action).
         The app checks for the marker below before it removes the entry from its outbox. -->
    <main data-quest-received="registration">
      <h1>Your registration has been received.</h1>
      <p><a href="/">Continue your quest</a></p>
    </main>
  </body>
</html>
