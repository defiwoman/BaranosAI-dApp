# Netlify configuration for the static learning simulation.
# The app lives at the repository root, so no base directory is set.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes (/cases, /case/01, /notebook …) must load index.html
# on refresh. Real files in dist/ are served first because this rule is not forced.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
